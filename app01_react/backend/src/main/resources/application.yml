server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: securevision-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securevision}
    username: ${DB_USER:securevision}
    password: ${DB_PASSWORD:securevision}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

securevision:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-securevision-2026-min-32-bytes}
    expiration-minutes: 60
  admin:
    username: ${ADMIN_USERNAME:admin}
    # bcrypt hash of "changeme-dev-only" (verified round-trip) - override via ADMIN_PASSWORD_HASH in every real deployment
    password-hash: ${ADMIN_PASSWORD_HASH:$2b$10$zQSot7Lxlrb5PdIg3SLzMu92L42rne/Rm29sgipNNYDoBVtQzmiju}

logging:
  level:
    com.securevision: INFO
